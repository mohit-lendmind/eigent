openapi: 3.1.0
info:
  title: Eigent Desktop Edge API
  version: 1.10.0
  description: |
    Public, additive-only API used by the Eigent desktop application. The edge
    authenticates the device/user, enforces tenant policy, and projects private
    Ops events. Desktop clients select a policy-controlled model alias; provider
    credentials, provider routes, inference grants, and internal service
    addresses are never accepted or returned.

    Every edge response carries the X-Eigent-Edge-Api-Version and
    X-Eigent-Min-Desktop-Version headers (documented on getIntegrationStatus);
    a client older than the advertised minimum must stop and update rather
    than degrade unpredictably.
servers:
  - url: https://api.eternly.example/eigent/v1
security:
  - bearerAuth: []
tags:
  - name: projects
  - name: commands
  - name: events
  - name: approvals
  - name: artifacts
  - name: catalog
  - name: skills
  - name: connectors
  - name: schedules
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      description: |
        The authenticated tenant's Projects, newest first. Each entry is the
        same snapshot getProject serves for a single Project — active run and
        sequence included — so a client renders the list, and resumes any row's
        run, without a follow-up request per row.
      parameters:
        - name: page_size
          in: query
          required: false
          description: |
            Entries per page (default 50). A value outside the documented bounds is
            refused with `400 invalid_argument` rather than clamped, so a client
            that asks for 5000 learns it instead of silently receiving 200.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: page_token
          in: query
          required: false
          description: |
            Opaque continuation from a prior response's `next_page_token`. It
            encodes a position only — every page is scoped to the authenticated
            tenant regardless of the token — and one this server cannot decode
            is `400 invalid_cursor`.
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: One page of Projects, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createProject
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [projects]
      responses:
        '200':
          description: Current durable Project projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectSnapshot'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/commands:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: submitCommand
      tags: [commands]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitCommandRequest'}
      responses:
        '202':
          description: Command admitted exactly once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: subscribeProjectEvents
      tags: [events]
      description: |
        Replays durable Project events strictly after the supplied cursor and
        then tails live events. Reconnect is read-only and never re-executes a
        command or tool. `sequence` and SSE `id` are decimal strings so browser
        number limits cannot corrupt a cursor.
      parameters:
        - name: after
          in: query
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: '^[0-9]+$'}
          description: Takes precedence over `after` when present.
      responses:
        '200':
          description: Project event stream defined by asyncapi.yaml
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '410':
          description: |
            Cursor fell outside the retained replay window. The problem carries
            `code: cursor_expired`, `minimum_sequence` (the smallest cursor
            that still replays gapless), and `high_water_sequence` (the
            Project's last allocated sequence at refusal). Recover by fetching
            the Project snapshot (getProject) and resuming with
            `after = last_sequence` — never by ignoring the gap.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /projects/{projectId}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      tags: [commands]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '202': {description: Epoch-fenced cancellation recorded}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/approvals/{approvalId}/response:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      operationId: respondToApproval
      tags: [approvals]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalResponse'}
      responses:
        '202': {description: Approval response recorded exactly once}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /models:
    get:
      operationId: listModelAliases
      tags: [catalog]
      description: |
        Policy-controlled model alias catalog for this device/user. Aliases are
        server-side names; concrete vendor models, routes, and credentials are
        resolved privately and never returned.
      responses:
        '200':
          description: Model aliases this client may select
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelAliasCatalog'}
        '401': {$ref: '#/components/responses/Problem'}
  /status:
    get:
      operationId: getIntegrationStatus
      tags: [catalog]
      # Unauthenticated by design (the Health-bypass precedent): an outdated or
      # signed-out client must still learn the compatibility window.
      security: []
      description: |
        Edge/backend integration handshake: contract versions and the minimum
        desktop client version this edge still serves. The same values ride the
        X-Eigent-Edge-Api-Version and X-Eigent-Min-Desktop-Version response
        headers, which every edge response carries.

        Authentication is optional on this route only. Without a credential the
        response is the anonymous compatibility window. With a valid bearer
        credential the response additionally carries auth_identity — the
        identity the edge verified, never the credential itself. A presented
        but invalid credential is refused with 401 rather than silently served
        anonymously.
      responses:
        '200':
          description: Integration status and compatibility window
          headers:
            X-Eigent-Edge-Api-Version: {$ref: '#/components/headers/EdgeApiVersion'}
            X-Eigent-Min-Desktop-Version: {$ref: '#/components/headers/MinDesktopVersion'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationStatus'}
        '401': {$ref: '#/components/responses/Problem'}
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      description: |
        What the authenticated tenant's settled runs cost. The figures come
        from the product's own run rows, recorded when each run settled — not
        from per-provider-turn accounting, which is turn bookkeeping rather
        than a ledger. Cost is therefore settlement-granular: a run still in
        flight contributes nothing and is absent from both the totals and the
        page.

        `totals` covers the whole window on every page, so a client that reads
        one page still reads a true total. `runs` is a bounded newest-settled-
        first page of the individual contributions behind it.
      parameters:
        - name: project_id
          in: query
          required: false
          description: |
            Narrow both the totals and the page to one Project. A Project that
            is not the caller's is `404 not_found`, never an empty bill — a
            zero here is a claim about the caller's own spend.
          schema: {type: string, maxLength: 128}
        - name: since
          in: query
          required: false
          description: |
            Inclusive start of the settlement-time window (RFC 3339). Unset
            means open, and the window is half-open, so adjacent windows
            partition a tenant's runs without double-billing a boundary run.
          schema: {type: string, format: date-time}
        - name: until
          in: query
          required: false
          description: |
            Exclusive end of the settlement-time window (RFC 3339). Must be
            later than `since`; an empty or inverted window is refused with
            `400 invalid_argument` rather than answered as a confident zero.
          schema: {type: string, format: date-time}
        - name: page_size
          in: query
          required: false
          description: |
            Per-run entries per page (default 50). Bounds the detail page only;
            the totals never depend on it.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: page_token
          in: query
          required: false
          description: |
            Opaque continuation from a prior response's `next_page_token`. One
            this server cannot decode is `400 invalid_cursor`.
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: Settled spend for the window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      operationId: getArtifact
      tags: [artifacts]
      responses:
        '200':
          description: Artifact metadata and a short-lived authorized download URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactAccess'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      description: |
        Latest version of every stored skill in the tenant catalog. Skill
        routes are served only by an edge connected to a cell; elsewhere they
        answer 501 (`code: not_implemented`) so clients can degrade cleanly.
      parameters:
        - $ref: '#/components/parameters/SkillUsageFlag'
      responses:
        '200':
          description: The tenant's durable skill catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillCatalog'}
        '401': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
  /skills/{name}:
    parameters:
      - $ref: '#/components/parameters/SkillName'
    get:
      operationId: getSkill
      tags: [skills]
      parameters:
        - name: version
          in: query
          schema: {type: integer, format: int64, minimum: 1}
          description: Specific version to fetch; omitted = the latest version.
        - $ref: '#/components/parameters/SkillUsageFlag'
      responses:
        '200':
          description: One stored skill version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putSkill
      tags: [skills]
      description: |
        Author or update a skill. The store is append-only: a content change
        writes a new version; an unchanged document dedups against the latest
        active version (`changed: false`, no new row). Writes are conditioned
        with If-Match (see the parameter), not Idempotency-Key — PUT here is
        naturally idempotent. A skill saved without activation rules is
        `manual`: registered and loadable on request, never auto-injected.
      parameters:
        - $ref: '#/components/parameters/SkillIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutSkillRequest'}
      responses:
        '200':
          description: Skill written (or deduplicated) onto an existing name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PutSkillResult'}
        '201':
          description: Skill created (this write produced version 1)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PutSkillResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409':
          description: |
            Two conflict shapes share this status, told apart by the problem
            `code`: `skill_stale` — If-Match named a version that is no longer
            the latest; re-read the skill and retry on the current version.
            `skill_write_conflict` (retryable) — concurrent writes raced on
            this skill; resend the same request.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413':
          description: |
            Request body exceeds the route's byte limit. The problem carries
            `code: payload_too_large`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: |
            The document failed skill validation. The problem carries
            `code: skill_invalid` and an itemized detail.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: |
            The tenant skill quota (count or encoded size) is full. The
            problem carries `code: skill_quota_exceeded`; this is a durable
            quota, not a rate limit — free space by deleting skills.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSkill
      tags: [skills]
      description: |
        Mark the skill deleted (a new version row carrying status `deleted` —
        the append-only history is retained). Deletion lives on DELETE only;
        the status route's set is {active, disabled}.
      responses:
        '204': {description: Skill marked deleted}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
  /skills/{name}/status:
    parameters:
      - $ref: '#/components/parameters/SkillName'
    post:
      operationId: setSkillStatus
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetSkillStatusRequest'}
      responses:
        '200':
          description: The new latest skill version carrying the status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      description: |
        The tenant's connector catalog with the caller's grant state on each
        row. Like the skill routes, connectors are served only by an edge
        connected to a cell; elsewhere they answer 501
        (`code: not_implemented`).

        A server whose connector vault is not configured still serves this
        route — the catalog is readable, and every oauth row reports
        `connectable: false` so a client renders the state instead of
        offering a Connect action that cannot succeed.
      responses:
        '200':
          description: The tenant's connector catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorCatalog'}
        '401': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
  /connectors/{connectorId}/auth:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    post:
      operationId: initiateConnectorAuth
      tags: [connectors]
      description: |
        Begin the brokered OAuth flow for this connector and return the
        provider's consent URL for the caller to open. The URL is the whole
        result: the edge never follows it and never holds a token. The flow
        completes on the cell's own callback listener, whose single-use state
        is the only thing that can redeem it — so a client polls
        `listConnectors` for `connected: true` rather than expecting a
        response here to mean the grant exists.
      responses:
        '200':
          description: The authorization URL to open
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorAuthorization'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: |
            The connector exists but cannot start a flow (`code:
            connector_not_ready`) — it is not an `oauth` connector, or its
            catalog row is not active. Neither is fixable by retrying; both
            are visible on listConnectors before the attempt.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '501':
          description: |
            Two shapes share this status, told apart by the problem `code`:
            `not_implemented` — this edge serves no connector plane at all;
            `connectors_not_configured` — the plane is there but the server has
            no connector vault (or cannot resolve a user identity for grants),
            so no connector can be authorized here. Both are operator
            configuration states: retrying changes nothing.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /connectors/{connectorId}/grant:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    delete:
      operationId: disconnectConnector
      tags: [connectors]
      description: |
        Revoke the caller's grant for this connector. Soft revoke: the grant
        row is retained as revoked for audit, the tokens are unusable, and the
        connector stays in the catalog. Disconnecting an already-disconnected
        connector succeeds, so this is safe to retry.
      responses:
        '204': {description: The caller holds no active grant for this connector}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Problem'}
  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      description: |
        The caller's own triggers, optionally narrowed to one Project. A
        `project_id` belonging to another tenant lists nothing rather than
        being refused — the narrowing is applied inside the caller's own
        query, so this route never confirms that another tenant's Project
        exists.
      parameters:
        - name: project_id
          in: query
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: The tenant's triggers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSchedule
      tags: [schedules]
      description: |
        Register a cron trigger on one of the caller's Projects. Every firing
        submits `task` as a command under a deterministic per-tick key, so one
        tick produces exactly one run no matter how delivery is retried.

        `Idempotency-Key` is required and scoped to the Project. A retried
        create replays the trigger the key already made; reusing a key for a
        different cadence or task is `409 conflict`. The duplicate this
        prevents is not one extra row — it is a second trigger firing beside
        the first, forever.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateScheduleRequest'}
      responses:
        '201':
          description: The registered trigger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ScheduleCadenceRefused'}
  /schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getSchedule
      tags: [schedules]
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateSchedule
      tags: [schedules]
      description: |
        Replace the editable fields whole and recompute the next fire from
        now. Status is deliberately not editable here: a paused trigger stays
        paused and a dead-lettered one stays disabled, so repairing a broken
        cadence never silently starts it firing. Use resume or requeue for
        that.

        One bounded window is accepted on purpose: a firing already in flight
        settles with the next fire it computed from the pre-edit expression,
        so the new cadence can be overwritten exactly once and the following
        tick converges.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateScheduleRequest'}
      responses:
        '200':
          description: The edited trigger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ScheduleCadenceRefused'}
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      description: |
        Remove the trigger. Its audit ledger survives the deletion — the
        trigger stops, the record of what it did does not — but it is no
        longer readable through listScheduleEvents, which serves a live
        trigger's history.
      responses:
        '204': {description: The trigger no longer exists}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/pause:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: pauseSchedule
      tags: [schedules]
      description: |
        Stop an active trigger firing. Ticks that elapse while it is paused
        are not made up on resume.
      responses:
        '200':
          description: The trigger as it stands after the transition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/ScheduleWrongStatus'}
  /schedules/{scheduleId}/resume:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: resumeSchedule
      tags: [schedules]
      description: |
        Return a paused trigger to service. This is the repair for a trigger a
        user stopped; a dead-lettered one needs requeue instead.
      responses:
        '200':
          description: The trigger as it stands after the transition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/ScheduleWrongStatus'}
  /schedules/{scheduleId}/requeue:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: requeueSchedule
      tags: [schedules]
      description: |
        Return a dead-lettered trigger to service, clearing the consecutive-
        failure count that disabled it. Separate from resume because it is a
        different repair: resume restarts a trigger a user stopped, requeue
        revives one the system disabled after repeated failures. A trigger
        recovers from `dead_letter` only this way, never on its own.
      responses:
        '200':
          description: The trigger as it stands after the transition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/ScheduleWrongStatus'}
  /schedules/{scheduleId}/events:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: listScheduleEvents
      tags: [schedules]
      description: |
        A bounded, newest-end window of the trigger's audit ledger — the
        answer to "why did this stop producing runs?", which the trigger row
        alone cannot give. A forfeited tick (`skipped_busy`,
        `skipped_generation`) leaves the trigger active with `attempts` at
        zero, so it is visible here and nowhere else.
      parameters:
        - name: limit
          in: query
          required: false
          description: Newest entries to return (default 50).
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: The newest window of the trigger's ledger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleEventList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    SkillName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SkillName'}
    SkillUsageFlag:
      name: usage
      in: query
      required: false
      schema: {type: boolean}
      description: |
        Include the `usage` counters on each returned skill. Opt-in: the
        counters are a second read the catalog itself never needs. A skill
        with no recorded use omits the field entirely rather than reporting
        zeros, so "never used" stays distinguishable.
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConnectorId'}
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    SkillIfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
      description: |
        Optimistic-concurrency fence: the decimal skill version this write is
        conditioned on. The write succeeds only while that is still the
        latest version (any status); otherwise 409 `skill_stale`. Omitted =
        unconditional write.
  headers:
    EdgeApiVersion:
      description: Semantic version of the edge API contract serving this response.
      schema: {type: string}
    MinDesktopVersion:
      description: Oldest desktop client version this edge still serves.
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ScheduleCadenceRefused:
      description: |
        The cadence cannot be scheduled. Two shapes share this status, told
        apart by the problem `code`: `schedule_cron_invalid` — the expression
        is not a five-field cron this server can parse; `schedule_cron_denied`
        — the expression is well-formed but names a cadence this API will not
        accept (a six-field expression schedules by the second). Neither is
        fixable by retrying the same body.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ScheduleWrongStatus:
      description: |
        The trigger is not in a status this transition applies to (`code:
        failed_precondition`) — pausing a paused trigger, resuming one that is
        dead-lettered, requeueing one that is merely paused. The current
        status is on the trigger; read it and offer the transition that fits.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Identifier: {type: string, minLength: 3, maxLength: 128}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [title, model_alias]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        model_alias: {$ref: '#/components/schemas/ModelAlias'}
    ModelAlias:
      type: string
      pattern: '^[a-z][a-z0-9_-]{1,63}$'
      description: Server-controlled policy alias, never a literal vendor model identifier.
    Project:
      type: object
      required: [project_id, title, model_alias, status, created_at, updated_at]
      properties:
        project_id: {$ref: '#/components/schemas/Identifier'}
        title: {type: string}
        model_alias: {$ref: '#/components/schemas/ModelAlias'}
        status: {type: string, enum: [active, closed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true
    ProjectSnapshot:
      type: object
      required: [project, last_sequence]
      properties:
        project: {$ref: '#/components/schemas/Project'}
        active_run: {$ref: '#/components/schemas/Run'}
        last_sequence: {$ref: '#/components/schemas/Sequence'}
        events_pruned_below:
          $ref: '#/components/schemas/Sequence'
          description: |
            Bounded-retention floor: events at sequences <= this have been
            pruned ("0" = nothing pruned). The smallest `after` cursor that
            still replays gapless.
      additionalProperties: true
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: {$ref: '#/components/schemas/ProjectSnapshot'}
        next_page_token:
          type: string
          description: |
            Absent on the last page. When present there are entries behind it —
            the server reads one row past the page to know — so a client may
            offer "load more" without a speculative fetch.
      additionalProperties: true
    UsageSummary:
      type: object
      required: [totals, runs]
      properties:
        totals: {$ref: '#/components/schemas/UsageTotals'}
        runs:
          type: array
          items: {$ref: '#/components/schemas/RunSpend'}
        next_page_token:
          type: string
          description: |
            Absent on the last page of per-run detail. It pages `runs` only —
            `totals` is identical on every page.
      additionalProperties: true
    UsageTotals:
      type: object
      required: [cost_micro_usd, provider_calls, runs_settled, runs_unrecorded]
      properties:
        cost_micro_usd:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Micro-USD (1e-6 USD) summed over the window's settled runs.
        provider_calls:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Metered provider calls behind that cost. Read the two together: a
            non-zero call count beside a zero cost means the alias carries no
            price list, which is UNPRICED, not free.
        runs_settled:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Terminal runs in the window. A live run is excluded — its spend is
            not settled and billing it would report a figure that later changes.
        runs_unrecorded:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Settled runs carrying no figure at all. They contribute nothing to
            the sums above, so a non-zero value here means the totals are a
            FLOOR; a surface that drops this term shows a partial sum as the
            whole bill.
      additionalProperties: true
    RunSpend:
      type: object
      required: [run_id, project_id, status]
      description: |
        One settled run's contribution. `cost_micro_usd` and `provider_calls`
        are OMITTED together when nothing was recorded for the run — that
        absence is what a client renders as pending, never as a cost of zero.
      properties:
        run_id: {type: string}
        project_id: {type: string}
        status: {type: string}
        ended_at: {type: string, format: date-time}
        cost_micro_usd: {type: string, pattern: '^[0-9]+$'}
        provider_calls: {type: string, pattern: '^[0-9]+$'}
      additionalProperties: true
    SubmitCommandRequest:
      type: object
      additionalProperties: false
      required: [command_id, text]
      properties:
        command_id: {$ref: '#/components/schemas/Identifier'}
        text: {type: string, minLength: 1, maxLength: 200000}
        attachment_ids:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/Identifier'}
    CommandReceipt:
      type: object
      required: [command_id, run_id, run_epoch, accepted_sequence]
      properties:
        command_id: {$ref: '#/components/schemas/Identifier'}
        run_id: {$ref: '#/components/schemas/Identifier'}
        run_epoch: {type: string, pattern: '^[1-9][0-9]*$'}
        accepted_sequence: {$ref: '#/components/schemas/Sequence'}
      additionalProperties: true
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expected_run_epoch]
      properties:
        expected_run_epoch: {type: string, pattern: '^[1-9][0-9]*$'}
    ApprovalResponse:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [allow, deny]}
        response_text: {type: string, maxLength: 10000}
    Sequence: {type: string, pattern: '^[0-9]+$'}
    Run:
      type: object
      required: [run_id, run_epoch, status]
      properties:
        run_id: {$ref: '#/components/schemas/Identifier'}
        run_epoch: {type: string, pattern: '^[1-9][0-9]*$'}
        # status is an OPEN string set like kind/visibility: the run state
        # machine is additive-only, so a consumer must tolerate values it does
        # not know (rendering policy: treat an unknown status as running/busy).
        # x-aion-known-values documents the values this contract version emits;
        # cancelling and recovery are non-terminal (cancellation recorded but
        # unsettled; a durable recovery label awaiting its named reconciler).
        status:
          type: string
          x-aion-known-values: [accepted, running, awaiting_approval, succeeded, failed, cancelled, cancelling, recovery]
      additionalProperties: true
    ProjectEvent:
      type: object
      x-aion-unknown-fields: preserve
      additionalProperties: true
      required: [event_id, schema_version, project_id, run_id, sequence, kind, visibility, occurred_at, data]
      properties:
        event_id: {$ref: '#/components/schemas/Identifier'}
        schema_version: {type: string, pattern: '^1\.'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        run_id: {$ref: '#/components/schemas/Identifier'}
        sequence: {$ref: '#/components/schemas/Sequence'}
        # kind and visibility are OPEN string sets: the event schema is
        # additive-only, so a consumer must pass unknown values through
        # (rendering policy: treat an unknown visibility as internal).
        # x-aion-known-values documents the values this contract version emits.
        kind:
          type: string
          x-aion-known-values: [run_accepted, text_delta, tool_call, tool_result, approval_required, approval_resolved, artifact_created, run_completed, run_failed, run_cancelled, subagent_started, subagent_ended]
        visibility:
          type: string
          x-aion-known-values: [user, internal, audit]
        occurred_at: {type: string, format: date-time}
        correlation:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      required: [artifact_id, project_id, name, media_type, size_bytes, sha256, created_at]
      properties:
        artifact_id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string}
        media_type: {type: string}
        size_bytes: {type: string, pattern: '^[0-9]+$'}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_at: {type: string, format: date-time}
      additionalProperties: true
    ArtifactAccess:
      type: object
      required: [artifact, download_url, expires_at]
      properties:
        artifact: {$ref: '#/components/schemas/Artifact'}
        download_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
      additionalProperties: true
    ModelAliasCatalog:
      type: object
      required: [aliases]
      properties:
        aliases:
          type: array
          items: {$ref: '#/components/schemas/ModelAliasOption'}
      additionalProperties: true
    ModelAliasOption:
      type: object
      required: [alias]
      properties:
        alias: {$ref: '#/components/schemas/ModelAlias'}
        display_name: {type: string}
        description: {type: string}
        is_default: {type: boolean}
        internal:
          type: boolean
          description: |
            Marks a diagnostic/CI fixture alias. Still valid on
            createProject; user-facing model pickers must not offer it.
      additionalProperties: true
    IntegrationStatus:
      type: object
      required: [edge_api_version, event_schema_version, minimum_desktop_version]
      properties:
        edge_api_version: {type: string}
        event_schema_version: {type: string}
        minimum_desktop_version: {type: string}
        harness_generation: {type: string}
        server_time: {type: string, format: date-time}
        execution_mode:
          type: string
          description: |
            Deployment-declared SandboxService execution mode of the serving
            cell (e.g. remote). Configuration truth for diagnostics, not a
            live probe.
        inference_status:
          type: string
          description: |
            Deployment-declared inference-plane posture of the serving cell
            (e.g. managed, disabled). Configuration truth for diagnostics,
            not a live probe.
        auth_identity:
          $ref: '#/components/schemas/AuthIdentity'
          description: |
            Present only when the request carried a valid bearer credential:
            the verified identity the edge maps tenancy from. Never echoes
            the credential.
      additionalProperties: true
    AuthIdentity:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string}
        user_id: {type: string}
      additionalProperties: true
    Problem:
      type: object
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        trace_id: {type: string}
        retryable: {type: boolean}
        minimum_sequence:
          $ref: '#/components/schemas/Sequence'
          description: |
            For code cursor_expired — the retention floor: the smallest `after`
            cursor that still replays gapless.
        high_water_sequence:
          $ref: '#/components/schemas/Sequence'
          description: |
            For code cursor_expired — the Project's last allocated sequence at
            refusal; a snapshot rehydrate covers at least up to here.
      additionalProperties: true
    SkillName:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Skill name. Full syntax is validated server-side; the `aion-` prefix
        is reserved for builtins.
    Skill:
      type: object
      required: [name, version, status, activation, document, content_hash]
      properties:
        name: {$ref: '#/components/schemas/SkillName'}
        version:
          type: integer
          format: int64
          minimum: 1
          description: |
            Append-only store version (a content or status change writes the
            next version; history is never rewritten). Distinct from any
            `Version` field inside the document, which is the author's own
            label.
        # status and activation are OPEN string sets (the store vocabulary is
        # additive-only); x-aion-known-values documents what this contract
        # version emits. A consumer must pass unknown values through
        # (rendering policy: treat an unknown status as disabled).
        status:
          type: string
          x-aion-known-values: [active, disabled, deleted]
        activation:
          type: string
          x-aion-known-values: [manual, always, rules]
          description: |
            How the skill enters a session: `manual` = registered and loadable
            via the skill tool only (the default for documents saved without
            activation rules), `always` = injected every turn, `rules` =
            stored predicates evaluated per turn.
        document:
          type: object
          additionalProperties: true
          description: |
            The full skill document. Canonical field names are Go PascalCase
            (the Agent spec_json convention — Name, Description, PromptText,
            Files[].Path/Content/Mode, ...); snake_case keys are accepted on
            input. File Content is base64-encoded raw bytes; Mode is unix
            permission bits as a number.
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Hex sha256 of the canonical document (the dedup key).
        origin: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/SkillUsage'}
      additionalProperties: true
    SkillUsage:
      type: object
      required: [activations, loads, executions]
      description: |
        How the skill was actually used, counted per NAME across all its
        versions. Present only when the request set `usage=true` AND the skill
        has recorded use. Counters are maintained outside the catalog's audit
        ledger, so use never invalidates a client's cached catalog.
      properties:
        activations:
          type: integer
          format: int64
          description: Automatic injections (an `always` or matched-rule turn).
        loads:
          type: integer
          format: int64
          description: Deliberate loads by the agent through the skill tool.
        executions:
          type: integer
          format: int64
          description: |
            Runs that reached the sandbox via run_skill, counted at any exit
            code — this is reach, not success.
        last_used_at: {type: string, format: date-time}
      additionalProperties: true
    SkillCatalog:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items: {$ref: '#/components/schemas/Skill'}
      additionalProperties: true
    PutSkillRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
          additionalProperties: true
          description: The skill document to store (see Skill.document).
        origin:
          type: string
          maxLength: 64
          description: |
            Provenance label recorded on the version row. Default
            `desktop_ui`.
    PutSkillResult:
      type: object
      required: [skill, changed, ignored_fields]
      properties:
        skill: {$ref: '#/components/schemas/Skill'}
        changed:
          type: boolean
          description: |
            false = content-hash dedup: the latest active version already
            carries this document, so no new version was written.
        ignored_fields:
          type: array
          items: {type: string}
          description: |
            Document fields that are inert in the stored context (e.g.
            `model`, `mcp_servers`) — accepted but stripped, named here so
            authors learn they did not take effect.
      additionalProperties: true
    SetSkillStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
          description: Deletion lives on the DELETE method, not here.
    ConnectorId:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Catalog identifier of a connector. Full syntax is validated
        server-side.
    Connector:
      type: object
      required: [connector_id, display_name, auth_kind, status, connected, connectable]
      description: |
        One catalog row plus the caller's own grant state. Grants are
        per-user; two users of the same tenant see the same catalog with
        different `connected` values.
      properties:
        connector_id: {$ref: '#/components/schemas/ConnectorId'}
        display_name: {type: string}
        # auth_kind and status are OPEN string sets (the catalog vocabulary is
        # additive-only); x-aion-known-values documents what this contract
        # version emits. Treat an unknown auth_kind as not connectable and an
        # unknown status as disabled.
        auth_kind:
          type: string
          x-aion-known-values: [none, static_env, oauth]
          description: |
            How the connector authenticates: `oauth` = per-user brokered
            grant (the only kind these routes can connect or disconnect),
            `static_env` = an operator-provided credential named by
            environment variable, `none` = no credential.
        status:
          type: string
          x-aion-known-values: [active]
          description: |
            Catalog state. This route serves `active` rows only — a
            self-registered connector of an exfiltration-capable kind is
            minted `draft` pending operator review, and neither draft nor
            disabled rows are user-facing. The field is on the wire so that
            surfacing them later is an additive change rather than a new
            shape; treat any other value as not usable.
        connected:
          type: boolean
          description: |
            For `oauth`, whether the caller holds an active grant. For the
            other kinds always true — they need no grant to be usable.
        connectable:
          type: boolean
          description: |
            Whether initiateConnectorAuth can succeed for this row on this
            server. False for an `oauth` connector on a server with no
            connector vault configured, where `connected` is also false but
            for a reason the user cannot fix. Always true for the kinds that
            need no grant. Render the Connect action off this field, not off
            `connected` alone.
    ConnectorCatalog:
      type: object
      required: [connectors]
      properties:
        connectors:
          type: array
          items: {$ref: '#/components/schemas/Connector'}
      additionalProperties: true
    ConnectorAuthorization:
      type: object
      required: [connector_id, authorization_url]
      properties:
        connector_id: {$ref: '#/components/schemas/ConnectorId'}
        authorization_url:
          type: string
          format: uri
          description: |
            The provider consent URL to open. Single-use and short-lived: it
            carries the flow state that redeems this attempt, so it is never
            cached or shared between users.
      additionalProperties: true
    Schedule:
      type: object
      required: [schedule_id, project_id, cron, task, single_shot, status, attempts, created_at, updated_at]
      additionalProperties: true
      description: |
        One registered cron trigger. Optional members are OMITTED rather than
        zeroed when they do not apply, so a trigger that has never fired is
        distinguishable from one that fired and succeeded.
      properties:
        schedule_id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        cron: {$ref: '#/components/schemas/CronExpression'}
        task:
          type: string
          description: The command text submitted on every firing.
        single_shot:
          type: boolean
          description: |
            Fire once and finish (`status: completed`) rather than on every
            matching tick.
        # status is an OPEN string set (additive-only); x-aion-known-values
        # documents what this contract version emits. Render an unknown value
        # as NOT firing — this surface exists so a trigger that quietly
        # stopped is visible, and treating an unknown status as healthy is
        # the one rendering that would hide exactly that.
        status:
          type: string
          x-aion-known-values: [active, paused, completed, dead_letter, unknown]
          description: |
            `active` = firing on its cadence. `paused` = stopped by the user,
            resumable. `completed` = a single-shot trigger that has fired;
            terminal. `dead_letter` = disabled by the system after repeated
            failures or an unretryable refusal; recovers only via requeue.
        next_fire_at:
          type: string
          format: date-time
          description: Omitted for a trigger that will not fire again.
        last_fired_tick:
          type: string
          format: date-time
          description: |
            The tick of the most recent firing. Omitted until the trigger has
            fired at least once — absence means "never fired", which no
            timestamp value could express.
        attempts:
          type: integer
          minimum: 0
          description: |
            Consecutive FAILED firings; a successful or forfeited firing
            resets it. The dead-letter cap is the server's, so this is a
            diagnosis rather than a countdown to render.
        last_error:
          type: string
          description: |
            Why the most recent firing failed. Omitted when the last firing
            did not fail.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CronExpression:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        A five-field cron expression: minute, hour, day-of-month, month,
        day-of-week. Six-field (per-second) expressions and `@`-descriptors
        are refused with 422.
    CreateScheduleRequest:
      type: object
      additionalProperties: false
      required: [project_id, cron, task]
      properties:
        project_id: {$ref: '#/components/schemas/Identifier'}
        cron: {$ref: '#/components/schemas/CronExpression'}
        task: {type: string, minLength: 1, maxLength: 200000}
        single_shot: {type: boolean, default: false}
    UpdateScheduleRequest:
      type: object
      additionalProperties: false
      required: [cron, task]
      description: |
        A whole replacement of the editable fields, not a patch: omitting
        `single_shot` sets it false.
      properties:
        cron: {$ref: '#/components/schemas/CronExpression'}
        task: {type: string, minLength: 1, maxLength: 200000}
        single_shot: {type: boolean, default: false}
    ScheduleList:
      type: object
      required: [schedules]
      additionalProperties: true
      properties:
        schedules:
          type: array
          items: {$ref: '#/components/schemas/Schedule'}
    ScheduleEvent:
      type: object
      required: [event_id, schedule_id, project_id, action, occurred_at]
      additionalProperties: true
      properties:
        event_id:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Ledger row identifier as a decimal STRING — a JS Number caps at
            2^53 and a ledger cursor must never pass through a float.
        schedule_id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        # action is an OPEN string set (additive-only); x-aion-known-values
        # documents what this contract version emits. An unrecognized action
        # is still a true ledger row: render it as-is rather than dropping it.
        action:
          type: string
          x-aion-known-values: [created, updated, paused, resumed, deleted, fired, skipped_busy, skipped_generation, fire_failed, dead_lettered, requeued, unknown]
          description: |
            Lifecycle mutations and firing outcomes share one vocabulary
            because the question this ledger answers — what has this trigger
            been doing? — does not separate them. `skipped_busy` = the tick
            was forfeited because the Project already had a run in flight;
            `skipped_generation` = forfeited because another harness
            generation owns the Project. Neither is a failure and neither
            increments `attempts`.
        payload:
          type: object
          additionalProperties: true
          description: |
            Free-form detail for the action (the tick, a missed-tick count,
            the admitted run, failure text). Deliberately unclosed: the
            closed part of this ledger is `action`, and a reader that does
            not understand a payload still reads a true history.
        occurred_at: {type: string, format: date-time}
    ScheduleEventList:
      type: object
      required: [events]
      additionalProperties: true
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/ScheduleEvent'}
